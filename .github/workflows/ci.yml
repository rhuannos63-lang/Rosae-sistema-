name: Testes
on:
  push:
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Funções do servidor (Deno)
        working-directory: supabase/functions
        run: deno lint && deno check assistente/index.ts whatsapp/index.ts email/index.ts
      - name: Testes do banco (permissões e regras financeiras)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql >/dev/null
          npm run test:db
      - run: npm run build
