name: Atualizar banco
# Aplica as migrações novas no Supabase quando o código chega na main.
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:
concurrency: banco
jobs:
  migrar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Projeto
        id: p
        run: |
          REF=$(jq -r .projeto_ref src/config.publico.json)
          if [ "$REF" = "null" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Supabase ainda não configurado; o workflow Configurar Supabase aplica o banco."; echo "ok=nao" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$REF" >> "$GITHUB_OUTPUT"; echo "ok=sim" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.p.outputs.ok == 'sim'
        with:
          version: 2.48.3
      - if: steps.p.outputs.ok == 'sim'
        run: |
          supabase link --project-ref "${{ steps.p.outputs.ref }}" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all
