name: Backup diário
# Copia o banco inteiro todo dia, criptografa e guarda 30 dias no próprio repositório privado.
# Também mantém o Supabase gratuito ativo (ele pausa após 7 dias sem uso).
on:
  schedule:
    - cron: '0 6 * * *' # 03:00 em Brasília
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      BACKUP_SENHA: ${{ secrets.BACKUP_SENHA || secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.48.3
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Exportar estrutura e dados
        run: |
          mkdir -p backup
          supabase db dump --password "$SUPABASE_DB_PASSWORD" -f backup/estrutura.sql
          supabase db dump --password "$SUPABASE_DB_PASSWORD" --data-only -f backup/dados.sql
          supabase db dump --password "$SUPABASE_DB_PASSWORD" --role-only -f backup/papeis.sql
          test -s backup/dados.sql
      - name: Criptografar
        run: |
          tar czf - backup | gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_SENHA" --symmetric --cipher-algo AES256 -o rosae-backup-$(date -u +%Y-%m-%d).tar.gz.gpg
          rm -rf backup
      - uses: actions/upload-artifact@v4
        with:
          name: rosae-backup-${{ github.run_id }}
          path: rosae-backup-*.tar.gz.gpg
          retention-days: 30
