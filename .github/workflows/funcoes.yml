name: Publicar assistente
# Publica as funções do assistente de IA e do WhatsApp no Supabase e copia as
# chaves cadastradas nos segredos do GitHub. Depois de cadastrar ou trocar uma
# chave, rode este workflow à mão (Actions › Publicar assistente › Run workflow).
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml']
  workflow_dispatch:
concurrency: funcoes
jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      WHATSAPP_NUMERO_ID: ${{ secrets.WHATSAPP_NUMERO_ID }}
      WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
      WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
      WHATSAPP_NUMERO_EXIBICAO: ${{ secrets.WHATSAPP_NUMERO_EXIBICAO }}
    steps:
      - uses: actions/checkout@v4
      - name: Projeto
        id: p
        run: |
          REF=$(jq -r .projeto_ref src/config.publico.json)
          if [ "$REF" = "null" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Supabase ainda não configurado."; echo "ok=nao" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$REF" >> "$GITHUB_OUTPUT"; echo "ok=sim" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.p.outputs.ok == 'sim'
        with:
          version: 2.48.3
      - name: Copiar chaves para o Supabase
        if: steps.p.outputs.ok == 'sim'
        run: |
          : > segredos.env
          for n in ANTHROPIC_API_KEY GEMINI_API_KEY WHATSAPP_TOKEN WHATSAPP_NUMERO_ID WHATSAPP_APP_SECRET WHATSAPP_VERIFY_TOKEN WHATSAPP_NUMERO_EXIBICAO; do
            v="${!n}"
            if [ -n "$v" ]; then echo "$n=$v" >> segredos.env; echo "• $n cadastrada"; else echo "• $n ainda não cadastrada"; fi
          done
          if [ -s segredos.env ]; then supabase secrets set --project-ref "${{ steps.p.outputs.ref }}" --env-file segredos.env; fi
          rm -f segredos.env
      - name: Publicar funções
        if: steps.p.outputs.ok == 'sim'
        run: supabase functions deploy --project-ref "${{ steps.p.outputs.ref }}" --use-api
